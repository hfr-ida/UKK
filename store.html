
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore</title>
    <link rel="stylesheet" href="store.css">
</head>
<body>

    <header>
        <h1>Elektronik Store</h1>
        <p>Menyediakan kebutuhan elektronik</p>
    </header>

    <section class="produk">

        <article class="produk">
            <div class="gambar">
                <img src="laptop.jpg" alt="Laptop">
            </div>
            <h2>Laptop</h2>
            <p>Rp10.000.000</p>
        </article>

        <article class="produk">
            <div class="gambar">
                <img src="handphone.jpg" alt="Handphone">
            </div>
            <h2>Handphone</h2>
            <p>Rp5.000.000</p>
        </article>

        <article class="produk">
            <div class="gambar">
                <img src="headset.jpg" alt="Headset">
            </div>
            <h2>Headset</h2>
            <p>Rp200.000</p>
        </article>

    </section>

    <form id="formPesan" action="#" method="get">

        <h2>Form Pemesanan</h2>

        <label for="nama">Nama Pemesan</label>
        <input type="text" id="nama" name="nama"
        required minlength="3" maxlength="50"
        pattern= "[A-Za-z ]+"
        title="Nama hanya boleh berisi huruf">

        <label for="hp">Nomor Handphone</label>
        <input type="tel" id="hp" name="hp"
        required pattern="[0-9]{10,13}"
        title="Isi 10 sampai 13 angka">

        <label for="produk">Produk</label>
        <select id="produk" name="produk" required>
            <option value="">-- Pilih --</option>
            <option value="Laptop">Laptop</option>
            <option value="Handphone">Handphone</option>
            <option value="Head">Headset</option>
        </select>

        <label for="jumlah">Jumlah</label>
        <input type="number" id="jumlah" name="jumlah"
        required min="1" max="20">

        <p>Metode Bayar</p>
        <input type="radio" id="transfer" name="bayar"
        value="Transfer" required>
        <label for="transfer">Transfer</label>
        <input type="radio" id="cod" name="bayar"
        value="COD">
        <label for="cod">COD</label>

        <label for="alamat">Alamat</label>
        <textarea id="alamat" name="alamat"
        required minlength="10" maxlength="200"></textarea>

        <button type="submit">Pesan</button>

    </form>

    <footer>
        <p>Kontak: 081234567890</p>
        <p>&copy; 2026 TechStore</p>
    </footer>

</body>
</html>
